name: CI

# Every push and pull request: the Definition-of-done checks that can run headless.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Sim pacing (GDD §17 #5 and #6; exits non-zero on a miss)
        run: |
          npm run -s sim -- --days 30 --seeds 1-20 --policy basic
          npm run -s sim -- --days 30 --seeds 1-20 --policy idle
      - run: npm run build
